# CyberOS SSH policy.
#
# archiso ships 10-archiso.conf with `PermitRootLogin yes` and
# `PasswordAuthentication yes`. That is safe on the stock Arch ISO, where the
# user sets a root password before exposing anything. CyberOS's live image
# ships root AND student with EMPTY passwords, so the same config is a hazard
# the moment sshd is started — and in a security lab that is one
# `sudo systemctl start sshd` away, which student can run via NOPASSWD sudo.
#
# sshd is not enabled by default, so this is defence in depth rather than a
# live hole. Unlike 10-archiso.conf this file is NOT excluded by the installer,
# so installed lab machines inherit the same policy.
PermitRootLogin no
PermitEmptyPasswords no
