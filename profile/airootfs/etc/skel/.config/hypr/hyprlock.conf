source = ~/.config/hypr/theme.conf

general {
    hide_cursor = true
}

background {
    path = /usr/share/backgrounds/cyberos/wallpaper.png
    blur_passes = 3
    blur_size = 6
}

input-field {
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    outer_color = $accent
    inner_color = $surface
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $accent
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = UMaT · CYBER DEPARTMENT
    color = $accent2
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
