# CyberOS Hyprland config — Cyber Department theme
# Docs: https://wiki.hyprland.org/Configuring/

source = ~/.config/hypr/theme.conf

monitor = , preferred, auto, 1

$terminal = foot
$menu     = rofi -show drun
$browser  = firefox
$files    = thunar
$editor   = code

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swayosd-server
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border   = $accent $accent2 45deg
    col.inactive_border = $border
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, ease, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, ease
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

cursor {
    # VMs (VMware/VirtualBox) have broken hardware cursor planes
    no_hardware_cursors = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ---------------- keybinds ----------------
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Tab, exec, rofi -show window
bind = $mod, period, exec, rofi -show emoji
bind = $mod, equal, exec, rofi -show calc -no-show-match -no-sort
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, C, exec, $editor
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, S, layoutmsg, togglesplit
bind = $mod SHIFT, L, exec, hyprlock
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod, X, exec, cliphist list | rofi -dmenu -p clipboard | cliphist decode | wl-copy

# screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# focus / move
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media / brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ---------------- window rules ----------------
windowrule = match:class ^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(VirtualBox Machine)$, float on
