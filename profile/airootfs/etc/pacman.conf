[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Department packages (pixie-sddm, vscode, onlyoffice, packettracer) are pre-installed.
# To let students update them, host the repo/ directory on the department server and
# uncomment the block below.
#
# Signatures are REQUIRED and the transport is https, deliberately. This is the one
# config students' machines fetch over a network, so an unsigned repository here is
# arbitrary code execution as root on every machine in the department. Do not relax
# it to make an unsigned repo work -- sign the repo instead (tools/release.sh).
#[cyberos]
#SigLevel = Required DatabaseRequired TrustedOnly
#Server = https://mirror.cyber.local/cyberos
