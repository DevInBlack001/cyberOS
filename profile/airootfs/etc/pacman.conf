[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Department AUR builds (pixie-sddm, vscode, onlyoffice, packettracer) are pre-installed.
# To let students update them, host the repo/ directory from the build on an internal
# web server and uncomment:
#[cyberos]
#SigLevel = Optional TrustAll
#Server = http://mirror.cyber.local/cyberos
