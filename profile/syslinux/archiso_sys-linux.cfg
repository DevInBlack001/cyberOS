LABEL arch
TEXT HELP
Boot CyberOS live / installer on BIOS.
Auto-logs in as student; open a terminal and run: sudo cyberos-install
ENDTEXT
MENU LABEL CyberOS live / installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G

LABEL cyberos_safe
TEXT HELP
Boot CyberOS with software rendering, for machines whose GPU driver fails
to start a desktop. Slower, but it gets you to a usable session.
ENDTEXT
MENU LABEL CyberOS (safe graphics) (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G nomodeset cyberos.safegraphics=1
